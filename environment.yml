# environment.yml — canonical conda env for EconetPy
#
# To apply this file:
#   - Update existing env in place:    micromamba env update -n shiny -f environment.yml --prune
#   - Or recreate fresh under new name: micromamba create -n shiny-fresh -f environment.yml
#
# Running `micromamba env create -f environment.yml` against an existing
# `shiny` env errors with "prefix already exists" — use one of the two
# forms above.
#
# Pair: requirements.txt (for `pip install -r requirements.txt` users).
# Both files must be kept in sync manually until a single source of truth
# is adopted (see spec docs/superpowers/specs/2026-05-25-pyvis-shiny-dropin-design.md
# Risks table).

name: shiny
channels:
  - conda-forge
dependencies:
  - python=3.13.*
  - git                          # required so pip can resolve git+https URLs at install time
  - shiny>=1.0.0
  - htmltools>=0.5.0
  - shinyswatch>=0.4.0
  - networkx>=3.0
  - pandas>=2.0.0
  - numpy>=2.0.0
  - scipy>=1.10.0
  - matplotlib>=3.7.0
  - seaborn>=0.12.0
  - pytest>=8.0
  - hypothesis>=6.100.0
  - pytest-playwright>=0.5.0
  - pip
  - pip:
      # Renamed pyvis -> pyvis-optimized in v4.3.1; import name is still `pyvis`.
      #
      # WARNING: the `shiny` env is SHARED — on laguna by ~20 apps, and locally
      # across projects — and holds ONE version, so this pin is effectively a
      # cross-project decision. Seven apps import pyvis (BowTie, EconetPy, EVA,
      # MosaicSES, NiDSES, osmose, SESPy). Never apply this file with
      # `--prune`: it would remove ~459 packages other projects need.
      #
      # v4.4.0 verified before bumping: additive changes plus one breaking one,
      # `require Python >=3.10` — satisfied (server runs 3.13.14). No app
      # hardcodes the bundled `lib/vis-<ver>/` path, so the vis-network
      # 10.0.2 -> 10.1.2 bundle move is safe.
      # Tag v4.4.0 == commit bee1467e90eeedd3f6878b167d0ae21ad2807069 (tags are mutable).
      - pyvis-optimized @ git+https://github.com/razinkele/pyvis.git@v4.4.0
