# environment.yml — canonical conda env for EconetPy
#
# To apply this file:
#   - Update existing env in place:    micromamba env update -n shiny -f environment.yml --prune
#   - Or recreate fresh under new name: micromamba create -n shiny-fresh -f environment.yml
#
# Running `micromamba env create -f environment.yml` against an existing
# `shiny` env errors with "prefix already exists" — use one of the two
# forms above.
#
# Pair: requirements.txt (for `pip install -r requirements.txt` users).
# Both files must be kept in sync manually until a single source of truth
# is adopted (see spec docs/superpowers/specs/2026-05-25-pyvis-shiny-dropin-design.md
# Risks table).

name: shiny
channels:
  - conda-forge
dependencies:
  - python=3.13.*
  - git                          # required so pip can resolve git+https URLs at install time
  - shiny>=1.0.0
  - htmltools>=0.5.0
  - shinyswatch>=0.4.0
  - networkx>=3.0
  - pandas>=2.0.0
  - numpy>=2.0.0
  - scipy>=1.10.0
  - matplotlib>=3.7.0
  - seaborn>=0.12.0
  - pytest>=8.0
  - hypothesis>=6.100.0
  - pytest-playwright>=0.5.0
  - pip
  - pip:
      # Renamed pyvis -> pyvis-optimized in v4.3.1; import name is still `pyvis`.
      # Tag v4.3.1 == commit d84e2931024f5d91b3fc1a969ea27596d29fcdb3 (tags are mutable).
      #
      # Verified compatible with BOTH v4.3.1 and v4.4.0 (EconetPy: 182 pass under
      # 4.4.0 locally, 58 pass under 4.3.1 on the server; BowTie's pyvis tests:
      # 21 pass under 4.4.0). A git+https requirement must name ONE ref, so this
      # pins the version actually deployed on the server.
      #
      # WARNING: the `shiny` env is SHARED — on laguna by ~20 apps, and locally
      # across projects. Sibling projects disagree (BowTie pins razinka::pyvis=4.2;
      # the pyvis-master working copy is past v4.4.0), and the env can only hold
      # one version: the last install wins. Bumping this pin moves that shared env
      # for every consumer, so change it deliberately. AQUABC is the one consumer
      # not yet tested above 4.2 — smoke it before any bump.
      - pyvis-optimized @ git+https://github.com/razinkele/pyvis.git@v4.3.1
