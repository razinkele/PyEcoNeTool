# EconetPy — block to insert into the server's /etc/shiny-server/shiny-server.conf,
# inside the `server { listen 3838 ... }` block, alongside the other Python apps.
#
# The `python` directive is what distinguishes a Python Shiny app from an R one
# here: R apps must NOT have it, Python apps must.
#
# render-configs.sh inserts this automatically; this file is the source of truth
# for what gets inserted.

  # ECONETPY — Baltic food-web analysis tool (Python Shiny port of the R
  # /EcoNeTool app, which stays live and untouched at /EcoNeTool).
  # Needs the razinkele pyvis fork (dist 'pyvis-optimized' >= 4.3.1) in the
  # shared env; the app writes data/user_feedback_log.ndjson, so the app tree
  # is group 'shiny' + setgid.
  location /EconetPy {
    app_dir /srv/shiny-server/EconetPy;
    python /opt/micromamba/envs/shiny/bin/python3;
    log_dir /var/log/shiny-server;
  }
