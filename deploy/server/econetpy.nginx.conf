# EconetPy — block to insert into the site's nginx vhost, inside the HTTPS
# `server { ... }` block, alongside the other Shiny app proxies.
#
# Requires a `map $http_upgrade $connection_upgrade { ... }` at http scope
# (the vhost already has one) — Shiny needs the WebSocket upgrade headers,
# and proxy_buffering must be off or reactive updates stall.
#
# render-configs.sh inserts this automatically; this file is the source of
# truth for what gets inserted.

    # EconetPy - Baltic food-web analysis tool (Python Shiny).
    # Separate from the R /EcoNeTool app; both stay live.
    location /EconetPy/ {
        proxy_pass http://127.0.0.1:3838/EconetPy/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    location = /EconetPy {
        return 301 /EconetPy/;
    }
